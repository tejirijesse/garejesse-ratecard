<body>

<!-- Brand splash (full lockup, once per session) -->
<div class="splash" id="splash" aria-hidden="true">

<div class="wipe" id="wipe" aria-hidden="true"></div>

<!-- Camera cursor -->
<div class="cam-cursor" id="cursor" aria-hidden="true">

</div>

  <span class="br tl"></span><span class="br tr"></span>
  <span class="br bl"></span><span class="br br2"></span>
</div>

<header class="top">
